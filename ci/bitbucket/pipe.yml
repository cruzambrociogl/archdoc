name: archdoc publish
image: ghcr.io/cruzambrociogl/archdoc-pipe:develop
description: Sends the record archdoc made of this repository to archdoc, with the token Bitbucket made for it. Checks nothing out.
category: Documentation
repository: https://github.com/cruzambrociogl/archdoc
maintainer:
  name: archdoc
tags:
  - archdoc
  - architecture
  - documentation
variables:
  - name: ARCHDOC_PROJECT
    default: ''
  - name: ARCHDOC_URL
    default: https://app.archdoc.dev
  - name: ARCHDOC_RECORD
    default: .archdoc/record.json
