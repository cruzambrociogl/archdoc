name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel a superseded run rather than letting queued jobs pile up on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -count=1 disables the test cache, so a green run always means the tests
      # actually executed. -race is affordable while the suite is small.
      - name: Test
        run: go test -race -count=1 ./...

  # AC-8 requires that a structure-only run transmits zero file contents. Making the network
  # boundary structural — only internal/semantic may reach outward — turns that from a manual
  # audit into a check. The rule is enforced from the first commit so it never has to be
  # retrofitted across a codebase that has already drifted.
  network-boundary:
    name: Network boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Only internal/semantic may import an outbound HTTP client
        run: |
          set -euo pipefail

          offenders=""
          for pkg in $(go list ./...); do
            case "$pkg" in
              */internal/semantic*) continue ;;
              */internal/serve*)    continue ;;  # serves localhost; inbound, not egress
            esac

            imports=$(go list -f '{{join .Imports "\n"}}' "$pkg")
            if echo "$imports" | grep -qx 'net/http'; then
              offenders="$offenders$pkg (net/http)\n"
            fi
            # The Anthropic SDK makes its own HTTP calls, so importing it would bypass the
            # net/http check above without ever naming net/http. Close that door too.
            if echo "$imports" | grep -q '^github.com/anthropics/anthropic-sdk-go'; then
              offenders="$offenders$pkg (anthropic-sdk-go)\n"
            fi
          done

          if [ -n "$offenders" ]; then
            echo "Packages outside internal/semantic import net/http:"
            printf "%b" "$offenders"
            echo
            echo "Only internal/semantic may make outbound calls — see CLAUDE.md, Hard rules."
            exit 1
          fi

          echo "Network boundary holds."

  # The engine's public API (package archdoc) is the one door to the pipeline: the CLI is its first
  # client and may import nothing from internal/, and a program in a module of its own — which Go
  # forbids from importing internal/ at all — documents a repository through it. If either breaks,
  # the API is no longer enough on its own (platform plan, step 1).
  public-api:
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: The CLI imports nothing from internal/
        run: |
          set -euo pipefail
          offenders=$(go list -f '{{join .Imports "\n"}}' ./cmd/archdoc | grep '/internal/' || true)
          if [ -n "$offenders" ]; then
            echo "cmd/archdoc imports internal packages — it may use only package archdoc:"
            echo "$offenders"
            exit 1
          fi
          echo "The CLI uses the public API only."

      - name: A program outside the module documents a repository
        working-directory: examples/library
        run: |
          set -euo pipefail
          go vet .
          work=$(mktemp -d)
          cp -R ../../testdata/drift/base "$work/shop"
          go run . "$work/shop"

  # The app every place shares (platform plan, step 2): the binary embeds its build, and published
  # sites are made of it. A change that breaks its typecheck or its build breaks all three places.
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

  # The GitHub Action (action.yml), run as a workflow runs it, on a repository whose second commit
  # adds a service: the comparison finds it, the site builds, current documentation passes the
  # check, and documentation the code has moved past fails it.
  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A repository whose second commit adds a service
        run: |
          r="$RUNNER_TEMP/repo"
          cp -R testdata/gateway "$r"
          cd "$r"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm one
          printf '  cache:\n    image: redis:7\n' >> docker-compose.yml
          git -c user.name=ci -c user.email=ci@example.com commit -qam two

      - id: compare
        uses: ./
        with:
          path: ${{ runner.temp }}/repo
          base: HEAD~1
          site: "true"

      - name: The comparison found the service, and the site was built
        env:
          CHANGES: ${{ steps.compare.outputs.changes }}
          SITE: ${{ steps.compare.outputs.site }}
        run: |
          test "$CHANGES" = 1 || { echo "changes: '$CHANGES', want 1"; exit 1; }
          test -f "$SITE/index.html" || { echo "no site at '$SITE'"; exit 1; }

      - name: Current documentation passes the check
        uses: ./
        with:
          path: ${{ runner.temp }}/repo
          check: "true"

      - name: The code moves past the documentation
        run: |
          printf '  queue:\n    image: rabbitmq:3\n' >> "$RUNNER_TEMP/repo/docker-compose.yml"

      - id: stale
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/repo
          check: "true"

      - name: Documentation the code has moved past fails the check
        env:
          OUTCOME: ${{ steps.stale.outcome }}
        run: test "$OUTCOME" = failure || { echo "the check passed out-of-date documentation"; exit 1; }
